version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Wait 7 days after a release before proposing it, so a compromised release is likely caught before it is
    # merged and deployed. Security updates are not delayed.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - '*'
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait 7 days after a release before proposing it, so a compromised release is likely caught before it is
    # merged and deployed. Security updates are not delayed.
    cooldown:
      default-days: 7
    labels:
      - dependencies
    commit-message:
      prefix: chore(ci)
